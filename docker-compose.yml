services:
  postgres:
    image: postgres:16-alpine
    container_name: uln-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: uln_dashboard
    volumes:
      - uln_pg_data:/var/lib/postgresql/data

volumes:
  uln_pg_data:
